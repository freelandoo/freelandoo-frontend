<!doctype html>
<!--
  EVO Brazil — o MOTOR da página própria (`/jogar/motor.html`).

  Este documento roda DENTRO do iframe que o `/jogar` (index.html) monta. O
  iframe existe por um motivo só: GIRAR. Em pé, a moldura gira 90° no CSS e o
  jogo segue recebendo uma janela deitada — e o navegador desfaz o `transform`
  ao entregar o toque ao iframe, então o Godot recebe coordenadas certas. Sem
  iframe, girar o canvas direto quebraria o toque (o Godot mede o canvas pelo
  `getBoundingClientRect`, que vem girado). Mesma origem e mesmos cabeçalhos
  COOP/COEP (`/jogar/:path*`), então o isolamento e a sessão seguem valendo.

  POR QUE EXISTE (ver `Cat demon/PERFORMANCE_AUDITORIA.md`): no `/monsters` o
  jogo roda num iframe DENTRO da Freelandoo, e no Android o iframe divide o
  processo com a página — React, Next, o chrome inteiro. Aqui o jogo é a página
  inteira: HTML puro, sem framework nenhum por baixo.

  E ELA É ISOLADA (COOP + COEP, ver `next.config.mjs`). É isso que liga o
  `SharedArrayBuffer`, que é o pré-requisito para a build com THREADS. A build
  continua no R2 e entra por rewrite (`/jogar/celular/*`, `/jogar/pc/*`) como se
  fosse desta origem — e mesma origem é a condição para o isolamento não a
  bloquear e para esta casca ler a sessão direto do `localStorage`, sem o
  `postMessage` do iframe.

  QUAL BUILD: a mesma pergunta do `/monsters` — a GPU lê S3TC? Lê → a de
  computador; não lê, ou na dúvida → a de celular.

  QUAL VERSÃO: a casca não sabe o número da release. Ela lê o `index.html` que
  a publicação deixa no R2 e tira dele o `GODOT_CONFIG` — a publicação continua
  sendo o único lugar que diz qual release está no ar.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0804">
<title>EVO Brazil</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0804; overflow: hidden;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
  #porta { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; background: #0b0804; color: #f5f1e8;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; z-index: 5; }
  #porta h1 { margin: 0; color: #f2b705; font: 900 34px/1 Impact, "Arial Black", sans-serif;
    letter-spacing: .02em; text-transform: uppercase; }
  #porta p { margin: 0; max-width: 340px; color: rgba(245,241,232,.62); }
  #barra { width: min(320px, 80vw); height: 6px; background: rgba(245,241,232,.12); }
  #barra > i { display: block; height: 100%; width: 0; background: #f2b705; transition: width .2s; }
  #porta a, #porta button { margin-top: 4px; border: 0; padding: 12px 22px; background: #f2b705;
    color: #0b0b0d; font: 700 15px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  #porta button[hidden], #porta a[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1">HTML5 canvas</canvas>
<div id="porta">
  <h1>EVO Brazil</h1>
  <p id="texto"></p>
  <div id="barra"><i></i></div>
  <button id="entrar" type="button" hidden></button>
  <a id="acao" hidden></a>
  <p id="dica" hidden style="margin:10px 24px 0;max-width:520px;text-align:center;color:rgba(245,241,232,.7);font-size:13px;line-height:1.4"></p>
  <small id="build" style="margin-top:6px;color:rgba(245,241,232,.35);font-size:11px;letter-spacing:.08em"></small>
</div>
<script>
(function () {
  "use strict";

  // ── IDIOMA: o mesmo cookie que o site usa (`NEXT_LOCALE`). ──────────────
  var TXT = {
    "pt-BR": { carregando: "carregando o mundo…", entrar: "Tocar para jogar",
      pronto: "Pronto. Toque para entrar em tela cheia.",
      prontoIos: "Pronto.",
      recicla: "liberando memória… o rancho volta já",
      ios: "Para jogar sem a barra do Safari: toque em Compartilhar e depois em “Adicionar à Tela de Início”. O EVO Brazil vira um app na sua tela.",
      login: "Entre na Freelandoo para jogar — seu monstro nasce do seu perfil.", loginCta: "Entrar",
      fechado: "O jogo está em teste fechado e por enquanto só abre para a administração.", voltar: "Voltar",
      erro: "O jogo não conseguiu abrir neste aparelho.",
      falta: "Este navegador não tem o que o jogo precisa: ",
      zerar: "Apagar todo o progresso do jogo neste aparelho e começar do zero? Não tem volta." },
    en: { carregando: "loading the world…", entrar: "Tap to play",
      pronto: "Ready. Tap to go full screen.",
      prontoIos: "Ready.",
      recicla: "freeing memory… the ranch is coming right back",
      ios: "To play without Safari's bar: tap Share, then “Add to Home Screen”. EVO Brazil becomes an app on your screen.",
      login: "Sign in to Freelandoo to play — your monster is born from your profile.", loginCta: "Sign in",
      fechado: "The game is in closed testing and only opens for administrators for now.", voltar: "Back",
      erro: "The game could not start on this device.",
      falta: "This browser lacks what the game needs: ",
      zerar: "Erase all game progress on this device and start over? This cannot be undone." },
    es: { carregando: "cargando el mundo…", entrar: "Toca para jugar",
      pronto: "Listo. Toca para pantalla completa.",
      prontoIos: "Listo.",
      recicla: "liberando memoria… el rancho vuelve enseguida",
      ios: "Para jugar sin la barra de Safari: toca Compartir y luego “Agregar a inicio”. EVO Brazil se vuelve una app en tu pantalla.",
      login: "Inicia sesión en Freelandoo para jugar — tu monstruo nace de tu perfil.", loginCta: "Entrar",
      fechado: "El juego está en prueba cerrada y por ahora solo abre para la administración.", voltar: "Volver",
      erro: "El juego no pudo abrirse en este dispositivo.",
      falta: "Este navegador no tiene lo que el juego necesita: ",
      zerar: "¿Borrar todo el progreso del juego en este dispositivo y empezar de cero? No se puede deshacer." }
  };
  var m = document.cookie.match(/(?:^|;\s*)NEXT_LOCALE=([^;]+)/);
  var loc = m ? decodeURIComponent(m[1]) : (navigator.language || "pt-BR");
  var L = TXT[loc] || TXT[loc.slice(0, 2)] || TXT["pt-BR"];
  document.documentElement.lang = TXT[loc] ? loc : "pt-BR";

  var porta = document.getElementById("porta");
  var texto = document.getElementById("texto");
  var barra = document.querySelector("#barra > i");
  var entrar = document.getElementById("entrar");
  var acao = document.getElementById("acao");
  texto.textContent = L.carregando;

  // ── O iPHONE NÃO TEM TELA CHEIA DE PÁGINA (só de vídeo): a barra do Safari
  // só some com o jogo INSTALADO na tela de início (manifesto em /jogar). Fora
  // dele, a porta ensina o caminho em vez de prometer uma tela cheia que não vem.
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var instalado = false;
  try {
    instalado = window.top.navigator.standalone === true
      || window.top.matchMedia("(display-mode: standalone)").matches
      || window.top.matchMedia("(display-mode: fullscreen)").matches;
  } catch (e) {}
  if (ios) L.pronto = L.prontoIos;
  if (ios && !instalado) {
    var dica = document.getElementById("dica");
    dica.textContent = L.ios;
    dica.hidden = false;
  }

  function para(msg, href, rotulo) {
    texto.textContent = msg;
    document.getElementById("barra").style.display = "none";
    if (href) { acao.href = href; acao.target = "_top"; acao.textContent = rotulo; acao.hidden = false; }
  }

  // ── A SESSÃO: mesma origem, então é ler o que o login guardou. ───────────
  var token = "", user = null;
  try {
    token = localStorage.getItem("token") || "";
    user = JSON.parse(localStorage.getItem("user") || "null");
  } catch (e) {}
  if (!token) { para(L.login, "/login?next=/jogar", L.loginCta); return; }
  // A MESMA TRAVA DO `/monsters`: por enquanto só a administração. É trava de
  // UI — a build é pública no R2 de qualquer forma; o que importa (a sessão)
  // só existe para quem está logado.
  var admin = !!(user && (user.is_admin || (user.roles || []).some(function (r) {
    return r && r.desc_role === "Administrator";
  })));
  if (!admin) { para(L.fechado, "/account", L.voltar); return; }

  // O jogo lê `window.__freelandoo` (ver `sessao.gd`) e sabe que está na
  // página própria por `__freelandoo_pagina` — é o que faz o "VOLTAR À
  // FREELANDOO" do menu navegar para o perfil.
  window.__freelandoo_pagina = true;
  window.__freelandoo = { token: token, api: "", handle: (user && user.username) || "" };

  // ── QUAL BUILD ───────────────────────────────────────────────────────────
  function leS3TC() {
    try {
      var c = document.createElement("canvas");
      var gl = c.getContext("webgl2") || c.getContext("webgl");
      if (!gl) return false;
      return (gl.getSupportedExtensions() || []).some(function (e) {
        return /compressed_texture_s3tc$/.test(e);
      });
    } catch (e) { return false; }
  }
  var dedo = window.matchMedia("(pointer: coarse)").matches;
  var aqui = new URLSearchParams(location.search);
  // `?mt=1` — A BUILD COM THREADS, em teste. Ela só existe para celular
  // (ETC2/ASTC) e só abre em página isolada, que é esta. Fica atrás da chave
  // até a medição no aparelho dizer se threads ajudam ou pioram a memória.
  // ⚠️ APARELHO DE TOQUE RECEBE SEMPRE A DE CELULAR. A pergunta da GPU sozinha
  // errava justo no iPhone: o Safari do iOS DIZ que lê S3TC (desde o iOS 8),
  // então o iPhone baixava a build de COMPUTADOR — pacote de 318 MB inteiro na
  // memória, textura em tamanho cheio e vídeo de fundo — e o iOS matava a aba
  // por memória depois de 2 ou 3 lutas, recarregando a página (Alex, 13/10).
  // `?build=pc|celular` força uma ou outra para medir.
  var pedida = aqui.get("build");
  var qual = aqui.get("mt") === "1" ? "celular-mt"
    : (pedida === "pc" || pedida === "celular") ? pedida
    : (!dedo && leS3TC()) ? "pc" : "celular";
  var base = "/jogar/" + qual + "/";
  document.getElementById("build").textContent = "build: " + qual;
  // As chaves de bancada passam adiante como no `/monsters`.
  var chaves = [];
  ["diag", "toque", "mt"].forEach(function (k) { if (aqui.get(k) === "1") chaves.push(k + "=1"); });
  
  // ── TELA CHEIA E DEITADO: só dentro de um gesto, e tela cheia antes. ────
  // Pedidos à página DE CIMA: tela cheia aqui dentro encheria só o iframe. O
  // gesto do toque vale para os ancestrais (ativação do usuário propaga), e
  // onde isso não alcança (iPhone) a moldura girada já resolve.
  function deita() {
    var topo; try { topo = window.top.document; } catch (e) { topo = document; }
    var el = topo.documentElement;
    var p = (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
    Promise.resolve(p).catch(function () {}).then(function () {
      try { (topo.defaultView || window).screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}
    });
  }

  // ── A RECICLAGEM DE MEMÓRIA (ver `Criacao.recicla_memoria`): no celular, ao
  // fim de cada campeonato o jogo guarda o rancho e recarrega SÓ este iframe
  // — é o único jeito de o iPhone devolver toda a memória de vídeo. Na volta
  // não há porta para tocar: o jogador já estava jogando, e o rancho reabre
  // sozinho. A marca é de uso único.
  var reciclou = false;
  try { reciclou = sessionStorage.getItem("evo_recicla") === "1"; sessionStorage.removeItem("evo_recicla"); } catch (e) {}
  if (reciclou) { texto.textContent = L.recicla; document.getElementById("dica").hidden = true; }

  // ── A CAIXA-PRETA: o jogo anota a cada 2 s onde está e quanta memória usa
  // (`window.__evo_ultimo`, ver `desempenho.gd`). Se o WebGL cair, a última
  // anotação fica guardada e aparece aqui na próxima abertura — é o dado que
  // o iPhone não deixa medir de outro jeito. Mostrada uma vez e apagada.
  try {
    var q = JSON.parse(localStorage.getItem("evo_queda") || "null");
    if (q) {
      localStorage.removeItem("evo_queda");
      var b = document.getElementById("build");
      b.textContent += " · última queda: " + (q.cena || "?") + " · vídeo " + q.video + " MB · textura "
        + q.textura + " MB · processo " + q.processo + " MB · " + q.fps + " fps · luzes " + q.luzes;
      b.style.color = "rgba(245,241,232,.75)";
    }
  } catch (e) {}
  document.getElementById("canvas").addEventListener("webglcontextlost", function () {
    try {
      var u = window.__evo_ultimo || {};
      u.quando = new Date().toISOString();
      localStorage.setItem("evo_queda", JSON.stringify(u));
    } catch (e) {}
  }, false);

  var carregou = false;
  var pediu = !dedo || reciclou;  // no computador não há gesto a pedir
  function talvezAbre() {
    if (!carregou || !pediu) return;
    porta.style.display = "none";
    document.body.classList.add("jogando");
    document.getElementById("canvas").focus();
  }
  if (dedo && !reciclou) {
    entrar.textContent = L.entrar;
    entrar.hidden = false;
    entrar.addEventListener("click", function () {
      deita();
      pediu = true;
      entrar.hidden = true;
      talvezAbre();
    });
  }

  // ── `?zerar=1`: RECOMEÇAR DO ZERO. O save não mora no servidor: é o
  // `user://` do Godot, que no navegador é o banco IndexedDB "/userfs" desta
  // origem. Apagá-lo ANTES de o motor subir zera rancho, bicho e configurações
  // deste aparelho. Pergunta antes (não tem volta) e tira a chave do endereço,
  // senão recarregar a página zeraria de novo.
  function zeraSeFoiPedido() {
    if (aqui.get("zerar") !== "1") return Promise.resolve();
    var limpa = new URLSearchParams(location.search);
    limpa.delete("zerar");
    var q = limpa.toString();
    try { window.top.history.replaceState(null, "", "/jogar" + (q ? "?" + q : "")); } catch (e) {}
    if (!window.confirm(L.zerar)) return Promise.resolve();
    return new Promise(function (ok) {
      try {
        var r = indexedDB.deleteDatabase("/userfs");
        r.onsuccess = r.onerror = r.onblocked = function () { ok(); };
      } catch (e) { ok(); }
    });
  }

  // ── FECHAR A ABA COM PROGRESSO NÃO SALVO ────────────────────────────────
  // O jogo não salva sozinho: os saves são 5 slots na conta, salvos à mão. O
  // jogo põe `window.__evo_sujo` (ver `Criacao._marca_alterado`) e a página DE
  // CIMA pede confirmação ao fechar. O texto é do navegador (não dá para mudar);
  // o Safari do iPhone costuma ignorar — lá vale o "SALVAR ANTES DE SAIR?" do jogo.
  var eu = window;
  try {
    window.top.addEventListener("beforeunload", function (ev) {
      if (eu.__evo_sujo) { ev.preventDefault(); ev.returnValue = ""; return ""; }
    });
  } catch (e) {}

  // ── A VERSÃO NO AR, lida do `index.html` da publicação ──────────────────
  zeraSeFoiPedido().then(function () { return fetch(base + "index.html", { cache: "no-cache" }); })
    .then(function (r) { if (!r.ok) throw new Error("index " + r.status); return r.text(); })
    .then(function (html) {
      var mc = html.match(/GODOT_CONFIG\s*=\s*(\{[\s\S]*?\});/);
      var mt = html.match(/GODOT_THREADS_ENABLED\s*=\s*(true|false)/);
      if (!mc) throw new Error("GODOT_CONFIG");
      var cfg = JSON.parse(mc[1]);
      var threads = !!(mt && mt[1] === "true");
      // O `executable` vira caminho desta origem; o tamanho dos arquivos é
      // indexado por ele (é dele que sai a barra de progresso).
      var exe = base + cfg.executable;
      var tamanhos = {};
      Object.keys(cfg.fileSizes || {}).forEach(function (k) { tamanhos[base + k] = cfg.fileSizes[k]; });
      cfg.executable = exe;
      cfg.fileSizes = tamanhos;
      cfg.mainPack = exe + ".pck";
      cfg.args = (cfg.args || []);
      // O isolamento é DESTA página (cabeçalhos), não do service worker do
      // Godot — que recarregaria a página para se instalar.
      cfg.ensureCrossOriginIsolationHeaders = false;
      return new Promise(function (ok, falha) {
        var s = document.createElement("script");
        s.src = exe + ".js";
        s.onload = function () { ok({ cfg: cfg, threads: threads }); };
        s.onerror = function () { falha(new Error("engine js")); };
        document.head.appendChild(s);
      });
    })
    .then(function (r) {
      /* global Engine */
      var falta = Engine.getMissingFeatures({ threads: r.threads });
      if (falta.length) { para(L.falta + falta.join(", ")); return; }
      var engine = new Engine(r.cfg);
      return engine.startGame({
        onProgress: function (atual, total) {
          if (atual > 0 && total > 0) barra.style.width = Math.round((atual / total) * 100) + "%";
        }
      }).then(function () {
        carregou = true;
        barra.style.width = "100%";
        if (dedo && !pediu) texto.textContent = L.pronto;
        talvezAbre();
      });
    })
    .catch(function (e) {
      console.error(e);
      para(L.erro, "/account", L.voltar);
    });
})();
</script>
</body>
</html>
