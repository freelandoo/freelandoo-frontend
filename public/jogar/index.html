<!doctype html>
<!--
  EVO Brazil — a PÁGINA PRÓPRIA do jogo (`/jogar`).

  POR QUE EXISTE (ver `Cat demon/PERFORMANCE_AUDITORIA.md`): no `/monsters` o
  jogo roda num iframe DENTRO da Freelandoo (React, Next, o chrome inteiro).
  Aqui não há framework nenhum: esta página é só uma MOLDURA e o motor mora em
  `/jogar/motor.html` — mesma origem, mesmos cabeçalhos COOP/COEP (ver
  `next.config.mjs`), então o isolamento e a build com threads seguem valendo.

  A MOLDURA EXISTE PARA GIRAR. Decisão do Alex: o jogo é SEMPRE deitado, não
  existe tela de "deite o celular". Com o aparelho em pé (só dedo), a moldura
  mede a tela ao contrário e gira 90° a partir do canto de cima: o iframe
  recebe uma janela deitada e o jogo nem sabe que o aparelho está em pé. O
  navegador desfaz o `transform` ao entregar o toque ao iframe, então o Godot
  recebe coordenadas certas — girar o canvas direto, sem iframe, quebraria o
  toque. É CSS puro: vale no iPhone (que não deixa travar a orientação) e
  persiste a partida inteira, segure o telefone como quiser. No Android a tela
  cheia + trava deitada (pedidas no toque de entrada, lá no motor) deixam o
  aparelho deitado de verdade, e aí a regra simplesmente não casa.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0804">
<title>EVO Brazil</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0804; overflow: hidden;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #moldura { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
  #moldura iframe { display: block; width: 100%; height: 100%; border: 0; }
  @media (pointer: coarse) and (orientation: portrait) {
    #moldura { width: 100vh; height: 100vw; width: 100dvh; height: 100dvw;
      transform-origin: top left; transform: rotate(90deg) translateY(-100%); }
  }
</style>
</head>
<body>
<div id="moldura">
  <iframe id="motor" title="EVO Brazil" allow="fullscreen; gamepad; autoplay; cross-origin-isolated"></iframe>
</div>
<script>
(function () {
  "use strict";
  var motor = document.getElementById("motor");
  // As chaves de bancada (`?diag=1`, `?toque=1`, `?mt=1`) passam ao motor.
  motor.src = "/jogar/motor.html" + location.search;
  // O jogo dentro do iframe avisa por mensagem. "VOLTAR À FREELANDOO" navega
  // esta página (a de cima), não o iframe. O `jogo:pronto` é ignorado: a
  // sessão o motor já leu sozinho, por ser da mesma origem.
  window.addEventListener("message", function (ev) {
    if (ev.origin !== location.origin || !ev.data) return;
    if (ev.data.tipo === "jogo:sair") {
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
      location.href = "/account";
    }
  });
  // O iframe recebe o foco para o teclado do computador valer de cara.
  motor.addEventListener("load", function () { try { motor.focus(); } catch (e) {} });
})();
</script>
</body>
</html>
